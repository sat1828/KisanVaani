<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="160" cy="60" r="260" fill="url(#glow1)"/>
  <circle cx="1140" cy="320" r="260" fill="url(#glow2)"/>

  <!-- scattered particle dots, echoing Particles3D -->
  <g fill="#86efac" opacity="0.5">
    <circle cx="90" cy="280" r="3"/>
    <circle cx="150" cy="240" r="2"/>
    <circle cx="1180" cy="70" r="3"/>
    <circle cx="1120" cy="120" r="2"/>
    <circle cx="980" cy="40" r="2"/>
    <circle cx="60" cy="120" r="2"/>
    <circle cx="220" cy="60" r="2"/>
    <circle cx="1050" cy="280" r="3"/>
  </g>

  <text x="640" y="118" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="30" fill="#bbf7d0" letter-spacing="6">कृषक मित्र</text>

  <text x="640" y="190" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="64" fill="url(#textGrad)">KisanVaani</text>

  <text x="640" y="232" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="20" fill="#dcfce7">Your personal agri-advisor, in every language, on any phone.</text>

  <!-- pill badges -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="365" y="262" width="150" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(74,222,128,0.4)"/>
    <text x="440" y="284" text-anchor="middle" fill="#bbf7d0">WhatsApp · Voice · Web</text>

    <rect x="525" y="262" width="120" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(74,222,128,0.4)"/>
    <text x="585" y="284" text-anchor="middle" fill="#bbf7d0">12+ languages</text>

    <rect x="655" y="262" width="150" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(74,222,128,0.4)"/>
    <text x="730" y="284" text-anchor="middle" fill="#bbf7d0">Claude vision diagnosis</text>
  </g>

  <text x="640" y="335" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4ade80" opacity="0.8">React · Express · Prisma · PostgreSQL · Twilio · Claude</text>
</svg>
