    <rect x="34" y="296" width="62" height="18" rx="9" fill="#dcfce7"/>
    <text x="42" y="309" font-size="9" fill="#15803d">85% match</text>

    <rect x="20" y="440" width="380" height="44" rx="14" fill="#ffffff" fill-opacity="0.6" stroke="#d1d5db"/>
    <text x="36" y="466" font-size="11" fill="#9ca3af">Apni samasya yahan likhein...</text>
    <circle cx="370" cy="462" r="16" fill="url(#btn)"/>
