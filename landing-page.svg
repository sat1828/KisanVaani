    <text x="90" y="540" font-size="11" fill="#6b7280">Languages (Claude AI)</text>

    <text x="240" y="520" font-size="24" font-weight="700" fill="#16a34a">6</text>
    <text x="240" y="540" font-size="11" fill="#6b7280">Crops, verified DB</text>

    <text x="370" y="520" font-size="24" font-weight="700" fill="#16a34a">&lt;5s</text>
    <text x="370" y="540" font-size="11" fill="#6b7280">Typical response</text>

